version: "3.8"
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wwf
      POSTGRES_PASSWORD: wwf_dev_password
      POSTGRES_DB: wwf_crotone
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wwf"]
      interval: 10s
  app:
    build: .
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://wwf:wwf_dev_password@postgres:5432/wwf_crotone
volumes:
  postgres_data:
