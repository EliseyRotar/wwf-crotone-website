name: E2E

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs for the same PR.
concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# E2E is a separate workflow from CI (lint/typecheck/test/build) so
# that an E2E flake doesn't block a fast green checkmark. We
# deliberately don't gate this on lint/typecheck — if those are broken
# the main CI workflow already failed.
jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    # Tag-based: run only @smoke + @a11y by default. The full suite
    # includes @admin (needs seeded creds) and @slow (touches SMTP) —
    # trigger those from a manual workflow_dispatch if you want them.
    env:
      BASE_URL: http://localhost:3000
      # The site refuses to boot without a real AUTH_SECRET. The CI
      # build job uses a different one — see .github/workflows/ci.yml.
      AUTH_SECRET: ci-test-secret-not-used-in-production-xxxxxxxxxxxxxxxx
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      # Disable Sentry / Plausible / Groq — the SDKs are no-ops when
      # their tokens are empty.
      SENTRY_DSN: ""
      NEXT_PUBLIC_SENTRY_DSN: ""
      NEXT_PUBLIC_PLAUSIBLE_DOMAIN: ""
      GROQ_API_KEY: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Install Playwright browsers
        # `--with-deps` adds the OS packages Chromium needs (libnss3,
        # libxkbcommon, etc.). On Ubuntu runners this is the recommended
        # path; the plain `chromium` install would fail at runtime.
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Run E2E tests (smoke + a11y)
        run: npm run test:e2e:smoke

      - name: Upload HTML report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 3
