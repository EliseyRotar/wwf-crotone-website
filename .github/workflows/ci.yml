name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch on a new push.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Fail fast: if lint or typecheck fail, downstream jobs (test, build) are
# skipped so we don't waste CI minutes building an image we know is broken.
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - run: npm run typecheck

  test:
    name: Test (Vitest)
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    # The build is the most expensive step and the one most likely to catch
    # prod-only regressions (e.g. RSC boundaries, missing env vars), so it
    # also gates the deploy workflow.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - run: npm run build
        env:
          DATABASE_URL: "postgresql://build:build@localhost:5432/build"
          AUTH_SECRET: "ci-test-secret-not-used-in-production-xxxxxxxxxxxxxxxx"
          NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
          # T3 Env validation requires these. See src/env/server.ts.
          GROQ_API_KEY: "ci-groq"
          AWS_ENDPOINT: "https://ci.r2.cloudflarestorage.com"
          AWS_ACCESS_KEY_ID: "ci-key"
          AWS_SECRET_ACCESS_KEY: "ci-secret"
          POSTGRES_PASSWORD: "ci-pass"
          SKIP_ENV_VALIDATION: "true"

  # End-to-end tests via Playwright. Runs in a separate job from the
  # Vitest unit tests because E2E:
  #   1. Builds + starts the Next.js server (expensive)
  #   2. Starts a Mailpit SMTP catcher so magic-link tests can fetch the
  #      email body and click the verification link (no real SMTP creds
  #      needed in CI)
  #   3. Tags tests via @smoke, @a11y, @admin, @signup, @chatbot etc.
  #
  # The job is skipped if Playwright is not installed yet (e.g. before
  # the first E2E setup commit). It re-uses the webServer config from
  # playwright.config.ts to launch the app.
  e2e:
    name: E2E (Playwright + Mailpit)
    runs-on: ubuntu-latest
    needs: [lint, typecheck, build]
    # Mailpit as a service container — runs alongside the test runner.
    # NOTE: services: must be a job-level sibling of steps:, NOT nested
    # inside steps. GitHub Actions rejects nested services as
    # "workflow file issue" (took me three commits to figure out).
    services:
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025   # SMTP
          - 8025:8025   # HTTP API
        options: >-
          --health-cmd "wget -qO- http://localhost:8025/api/v1/info || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run smoke + a11y + admin + chatbot suites
        env:
          # Point the app at Mailpit for SMTP — no real creds needed
          SMTP_HOST: 127.0.0.1
          SMTP_PORT: "1025"
          SMTP_SECURE: "false"
          SMTP_USER: ""
          SMTP_PASS: ""
          USE_BREVO_EMAIL: "false"
          ADMIN_NOTIFY_EMAIL: ci-admin@example.com
          # Test-only override so /api/account/magic-link knows where
          # to fetch the magic link from
          MAILPIT_URL: http://127.0.0.1:8025
          # CI-only env validation bypass — we don't have real DB
          DATABASE_URL: postgresql://nobody@localhost:5432/nodb
          AUTH_SECRET: ci-test-secret-not-used-in-production-xxxxxxxxxxxxxxxx
          AWS_ENDPOINT: https://ci.r2.cloudflarestorage.com
          AWS_ACCESS_KEY_ID: ci-key
          AWS_SECRET_ACCESS_KEY: ci-secret
          POSTGRES_PASSWORD: ci-pass
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
          GROQ_API_KEY: ci-groq
          SKIP_ENV_VALIDATION: "true"
        run: npm run test:e2e:smoke -- --reporter=github

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7
