# Production Docker Compose — Netcup VPS 500 G12, Debian 13.
# Stack: Next.js 15 standalone + Postgres 16 + Redis 7 + Nginx + WAL-G (R2).
#
# This compose is meant to be invoked from /srv/wwf/ (so 'context: ./repo'
# means the deploy-tree root). The Dockerfile lives at /srv/wwf/Dockerfile
# (the actual build of the Next.js app); the custom postgres image with
# wal-g baked in is built from infra/postgres.Dockerfile and pulled as
# wwf-postgres:latest.
#
# Backups: cron-driven `docker exec infra-postgres-1 wal-g backup-push`
# (script in infra/scripts/walg-backup.sh) → Cloudflare R2 bucket wwf-backups.
# Continuous WAL archiving via postgres archive_command → wal-g wal-push.

services:
  app:
    image: wwf-app:latest
    build:
      context: ./repo
      dockerfile: ../Dockerfile
    restart: unless-stopped
    expose: ["3000"]
    env_file:
      - ./.env.production
    environment:
      DATABASE_URL: postgresql://wwf:${POSTGRES_PASSWORD}@postgres:5432/wwf
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      TRUSTED_PROXY_HEADER: cf-connecting-ip
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [appnet]
    # Per-service healthcheck overrides the Dockerfile-level one (which
    # is identical, but explicitly defining it here makes the contract
    # clear and lets you change the probe without rebuilding the image).
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M

  migrate:
    image: wwf-app:latest
    build:
      context: ./repo
      dockerfile: ../Dockerfile
    restart: "no"
    command: ["sh", "-c", "npx prisma migrate deploy && npx tsx prisma/seed.ts || true"]
    env_file:
      - ./.env.production
    environment:
      DATABASE_URL: postgresql://wwf:${POSTGRES_PASSWORD}@postgres:5432/wwf
    depends_on:
      postgres: { condition: service_healthy }
    networks: [appnet]

  postgres:
    image: wwf-postgres:latest
    build:
      context: .
      dockerfile: postgres.Dockerfile
    restart: unless-stopped
    env_file:
      - ./.env.production
    environment:
      POSTGRES_DB: wwf
      POSTGRES_USER: wwf
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
      # WAL-G → Cloudflare R2
      WALG_S3_PREFIX: ${WALG_S3_PREFIX:-s3://wwf-backups}
      # R2 buckets are jurisdiction-specific. The bucket was created with
      # no LocationHint (default = global jurisdiction), so it lives at
      # <accountid>.r2.cloudflarestorage.com, NOT at the .eu. endpoint.
      # Using the EU endpoint here returns NoSuchBucket even though
      # listing via the CF API shows the bucket exists. The default
      # below is the global endpoint; override only if you specifically
      # created the bucket with LocationHint: EU.
      AWS_ENDPOINT: ${AWS_ENDPOINT:-https://CHANGE_ME.r2.cloudflarestorage.com}
      AWS_REGION: ${AWS_REGION:-auto}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      # R2 uses virtual-hosted bucket addressing — bucket name goes in the
      # hostname (wwf-backups.<endpoint>), not in the path. wal-g's default
      # AWS_S3_FORCE_PATH_STYLE=true breaks this; R2 returns 404.
      AWS_S3_FORCE_PATH_STYLE: "false"
      WALG_COMPRESSION_METHOD: ${WALG_COMPRESSION_METHOD:-lz4}
      WALG_DELTA_MAX_STEPS: "5"
    volumes:
      - /srv/wwf/postgres/data:/var/lib/postgresql/data
    expose: ["5432"]
    networks: [appnet]
    # Enable WAL archiving. wal-g wal-push is called from the entrypoint
    # so every time postgres rotates a WAL segment it lands in R2.
    command: >
      postgres
        -c archive_mode=on
        -c archive_command="/usr/local/bin/wal-g wal-push %p"
        -c wal_level=replica
        -c max_wal_senders=10
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wwf -d wwf"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2048M

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru", "--save", "60", "1000"]
    volumes:
      - /srv/wwf/redis/data:/data
    expose: ["6379"]
    networks: [appnet]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 256M

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: wwf-nginx:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /srv/wwf/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /srv/wwf/nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/ssl/cloudflare:/etc/ssl/cloudflare:ro
      - /srv/wwf/assets:/srv/wwf/assets:ro
      - /var/log/wwf:/var/log/wwf
    depends_on:
      app: { condition: service_healthy }
    networks: [appnet]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Status page cron worker. Polls UptimeRobot + 8 public Atlassian-
  # Statuspage feeds + self-probes every 60s and writes StatusSnapshot /
  # StatusPeriod / Incident rows. Uses the same image as the app
  # (so we get the same Prisma client) but only runs scripts/status-poll.js.
  # No public port — talks to the database and the public internet only.
  #
  # Healthcheck: instead of the inherited wget-on-:3000 probe (which
  # always fails for a non-HTTP worker), we probe the DB. The cron is
  # healthy iff (a) Postgres is reachable AND (b) the most recent
  # StatusSnapshot was written within the last 3 minutes (i.e. at least
  # one tick completed). If the cron loop dies, no new snapshot lands,
  # and this probe starts failing within ~3 min. Docker then restarts
  # the container via restart: unless-stopped.
  #
  # scripts/ is bind-mounted read-only from /srv/wwf/repo because we
  # need env-script.cjs (status-poll.js's CJS env helper) to be at
  # /app/scripts/env-script.cjs — the Dockerfile layer that copies
  # scripts/ into the runner image is unreliable when .next/standalone
  # overlays the same path.
  cron:
    image: wwf-app:latest
    build:
      context: ./repo
      dockerfile: ../Dockerfile
    restart: unless-stopped
    command: ["sh", "-c", "npx prisma generate && node scripts/status-poll.js"]
    env_file:
      - ./.env.production
    environment:
      DATABASE_URL: postgresql://wwf:${POSTGRES_PASSWORD}@postgres:5432/wwf
      SELF_HEALTH_URL: http://app:3000/api/health
      UPTIMEROBOT_API_KEY: ${UPTIMEROBOT_API_KEY:-}
    volumes:
      - /srv/wwf/repo/scripts:/app/scripts:ro
    depends_on:
      app: { condition: service_healthy }
      postgres: { condition: service_healthy }
    networks: [appnet]
    healthcheck:
      test:
        - CMD-SHELL
        - 'node -e "const{PrismaClient}=require(\"@prisma/client\");const p=new PrismaClient();const m=Date.now();p.statusSnapshot.findFirst({orderBy:{taken_at:\"desc\"},select:{taken_at:true}}).then(r=>{const age=r?(m-r.taken_at.getTime()):Infinity;process.exit(age<180000?0:1)}).catch(()=>process.exit(1))"'
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 256M

networks:
  appnet:
    driver: bridge
