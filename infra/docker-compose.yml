# Production Docker Compose — Netcup VPS 500 G12, Debian 13.
# Stack: Next.js 15 standalone + Postgres 16 + Redis 7 + Nginx + WAL-G (R2).
#
# This compose is meant to be invoked from /srv/wwf/ (so 'context: ./repo'
# means the deploy-tree root). The Dockerfile lives at /srv/wwf/Dockerfile
# (the actual build of the Next.js app); the custom postgres image with
# wal-g baked in is built from infra/postgres.Dockerfile and pulled as
# wwf-postgres:latest.
#
# Backups: cron-driven `docker exec infra-postgres-1 wal-g backup-push`
# (script in infra/scripts/walg-backup.sh) → Cloudflare R2 bucket wwf-backups.
# Continuous WAL archiving via postgres archive_command → wal-g wal-push.

services:
  app:
    image: wwf-app:latest
    build:
      context: ./repo
      dockerfile: ../Dockerfile
    restart: unless-stopped
    expose: ["3000"]
    env_file:
      - ./.env.production
    environment:
      DATABASE_URL: postgresql://wwf:${POSTGRES_PASSWORD}@postgres:5432/wwf
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      TRUSTED_PROXY_HEADER: cf-connecting-ip
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [appnet]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M

  migrate:
    image: wwf-app:latest
    build:
      context: ./repo
      dockerfile: ../Dockerfile
    restart: "no"
    command: ["sh", "-c", "npx prisma migrate deploy && npx tsx prisma/seed.ts || true"]
    env_file:
      - ./.env.production
    environment:
      DATABASE_URL: postgresql://wwf:${POSTGRES_PASSWORD}@postgres:5432/wwf
    depends_on:
      postgres: { condition: service_healthy }
    networks: [appnet]

  postgres:
    image: wwf-postgres:latest
    build:
      context: .
      dockerfile: postgres.Dockerfile
    restart: unless-stopped
    env_file:
      - ./.env.production
    environment:
      POSTGRES_DB: wwf
      POSTGRES_USER: wwf
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
      # WAL-G → Cloudflare R2
      WALG_S3_PREFIX: ${WALG_S3_PREFIX:-s3://wwf-backups}
      AWS_ENDPOINT: ${AWS_ENDPOINT:-https://CHANGE_ME.r2.cloudflarestorage.com}
      AWS_REGION: ${AWS_REGION:-auto}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_S3_FORCE_PATH_STYLE: "true"
      WALG_COMPRESSION_METHOD: ${WALG_COMPRESSION_METHOD:-lz4}
      WALG_DELTA_MAX_STEPS: "5"
    volumes:
      - /srv/wwf/postgres/data:/var/lib/postgresql/data
    expose: ["5432"]
    networks: [appnet]
    # Enable WAL archiving. wal-g wal-push is called from the entrypoint
    # so every time postgres rotates a WAL segment it lands in R2.
    command: >
      postgres
        -c archive_mode=on
        -c archive_command="/usr/local/bin/wal-g wal-push %p"
        -c wal_level=replica
        -c max_wal_senders=10
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wwf -d wwf"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2048M

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru", "--save", "60", "1000"]
    volumes:
      - /srv/wwf/redis/data:/data
    expose: ["6379"]
    networks: [appnet]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 256M

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: wwf-nginx:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /srv/wwf/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /srv/wwf/nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/ssl/cloudflare:/etc/ssl/cloudflare:ro
      - /srv/wwf/assets:/srv/wwf/assets:ro
      - /var/log/wwf:/var/log/wwf
    depends_on:
      app: { condition: service_healthy }
    networks: [appnet]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  appnet:
    driver: bridge
