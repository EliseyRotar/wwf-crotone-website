# Production Nginx config — Contabo VPS, behind Cloudflare proxy.
# Real client IP from CF-Connecting-IP. TLS terminated by Cloudflare
# Universal SSL; we use a Cloudflare Origin certificate on the VPS side.

user nginx;
worker_processes auto;
error_log /var/log/wwf/nginx-error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;
    client_max_body_size 10M;

    # Cloudflare trusted IPs — only these can connect. Anyone else hits
    # a 403, which means even if your origin IP leaks, attackers can't
    # bypass Cloudflare.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    real_ip_header CF-Connecting-IP;

    # Geo-IP via CF (CF-IPCountry header). Allowed countries for /admin:
    # Italy, EU + EEA + CH + UK. Block everything else.
    map $http_cf_ipcountry $admin_allowed {
        IT 1;
        DE 1; FR 1; ES 1; AT 1; BE 1; NL 1; PT 1; PL 1; IE 1;
        GR 1; CZ 1; HU 1; RO 1; BG 1; HR 1; SK 1; SI 1; LT 1; LV 1;
        EE 1; CY 1; MT 1; LU 1; DK 1; SE 1; FI 1;
        IS 1; LI 1; NO 1; CH 1; GB 1;
        default 0;
    }

    # Rate limit zones (defense in depth — app has its own per-route limits)
    limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth:5m rate=5r/s;

    # Logging format
    log_format wwf '$remote_addr [$time_iso8601] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time cf_country=$http_cf_ipcountry';

    include /etc/nginx/conf.d/*.conf;
}