# Site config — wwfcrotone.it (apex) + www.wwfcrotone.it (alias, 301→apex)
# + admin.wwfcrotone.it + status.wwfcrotone.it (CNAME→Instatus, with
# Nginx 302 fallback if Cloudflare ever bypasses).
# TLS terminated by Cloudflare Universal SSL. We use a Cloudflare Origin
# certificate (15-year validity) on the VPS side so the connection between
# Cloudflare edge and the origin is also encrypted.

upstream nextjs_app {
    server app:3000;
    keepalive 64;
}

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name wwfcrotone.it www.wwfcrotone.it admin.wwfcrotone.it status.wwfcrotone.it;
    return 301 https://$host$request_uri;
}

# Main site + www + admin
server {
    listen 443 ssl http2;
    server_name wwfcrotone.it www.wwfcrotone.it admin.wwfcrotone.it;

    ssl_certificate     /etc/ssl/cloudflare/cert.pem;
    ssl_certificate_key /etc/ssl/cloudflare/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers (defense in depth — also set by middleware)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    access_log /var/log/wwf/nginx-access.log wwf;
    error_log  /var/log/wwf/nginx-error.log warn;

    # Static assets served directly by Nginx (no Next.js hop)
    location /images/ {
        alias /srv/wwf/assets/images/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location /logos/ {
        alias /srv/wwf/assets/logos/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location /downloads/ {
        alias /srv/wwf/assets/downloads/;
        expires 1d;
        try_files $uri =404;
    }
    location /uploads/ {
        alias /srv/wwf/assets/uploads/;
        expires 1d;
        try_files $uri =404;
    }

    # API + admin auth: tighter rate limits + CSRF-friendly
    location /api/admin/ {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://nextjs_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /api/account/ {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://nextjs_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /api/chat {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://nextjs_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s; # chatbot streaming can be slow
    }

    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://nextjs_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # /admin/* and /[locale]/admin/* — geo-restricted
    location ~ "^/(?:[a-z]{2}/)?admin" {
        if ($admin_allowed = 0) { return 403; }
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://nextjs_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else
    location / {
        limit_req zone=general burst=60 nodelay;
        proxy_pass http://nextjs_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health (no logging)
    location = /health {
        access_log off;
        return 200 "ok\n";
    }
}

# status.wwfcrotone.it — Cloudflare CNAME points this hostname to
# wwfcrotone.instatus.com (Instatus Free tier), which serves the
# status page at both URLs. This Nginx block is a safety net for
# the case where someone reaches the origin IP directly (bypassing
# the CF CNAME) — we 302 them to the canonical Instatus URL.
server {
    listen 443 ssl http2;
    server_name status.wwfcrotone.it;
    ssl_certificate     /etc/ssl/cloudflare/cert.pem;
    ssl_certificate_key /etc/ssl/cloudflare/key.pem;
    access_log off;
    return 302 https://wwfcrotone.instatus.com;
}